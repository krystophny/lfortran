name: WITH_LIRIC checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  with_liric:
    name: Build and test WITH_LIRIC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: mamba-org/setup-micromamba@v2.0.2
        with:
          micromamba-version: "2.0.4-0"
          environment-file: ci/environment.yml
          create-args: >-
            python=3.10
            llvmdev=21
            bison=3.4
            openblas=0.3.21
            llvm-openmp=14.0.4
            make=4.3
            nodejs=18.20.4
            openmpi=5.0.6=hb85ec53_102
            zlib=1.3.1
            zstd-static=1.5.7

      - name: Prepare generated parser sources
        shell: bash -e -l {0}
        run: ./build0.sh

      - name: Fetch and build liric
        shell: bash -e -l {0}
        run: |
          git clone --depth 1 --branch fix/lfortran-runtime-exe-emission https://github.com/krystophny/liric.git /tmp/liric
          cmake -S /tmp/liric -B /tmp/liric/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/liric/build -j"$(nproc)"

      - name: Configure and build LFortran WITH_LIRIC
        shell: bash -e -l {0}
        run: |
          cmake -S . -B build-liric -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_LIRIC=yes \
            -DLIRIC_DIR=/tmp/liric \
            -DWITH_STACKTRACE=no \
            -DWITH_RUNTIME_STACKTRACE=yes
          cmake --build build-liric -j"$(nproc)"

      - name: Run CTest suite
        shell: bash -e -l {0}
        run: ctest --test-dir build-liric --output-on-failure

      - name: Run reference suite in WITH_LIRIC mode
        shell: bash -e -l {0}
        run: |
          export PATH="$PWD/build-liric/src/bin:$PATH"
          export LFORTRAN_NO_LINK_MODULE_EMPTY_OBJECTS=1
          ./run_tests.py --exclude-backend llvm --no-color

      - name: Run integration suites in WITH_LIRIC mode
        shell: bash -e -l {0}
        run: |
          export PATH="$PWD/build-liric/src/bin:$PATH"
          unset LFORTRAN_NO_LINK_MODULE_EMPTY_OBJECTS
          export LFORTRAN_LINKER=gcc
          export LFORTRAN_NO_LINK_MODE=1
          cd integration_tests
          ./run_tests.py -b llvm --ninja -j1
          ./run_tests.py -b llvm -f -nf16 --ninja -j1
